# Builds a signed release APK in the same Docker image the Makefile uses.
#
# Requires one repository secret, KEYSTORE_PASSWORD, and a keystore committed
# at keystore/release.keystore or restored into place before the build step.
# See the README section "The keystore".

name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the APK, without the leading v (e.g. 1.2.3)"
        required: true
        default: "0.1.0"

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Inject build info
        run: |
          CLEAN_VERSION=$(echo "${{ inputs.version }}" | sed 's/^v//')
          sed -i "s/^version = .*/version = ${CLEAN_VERSION}/" buildozer.spec
          # Version code must be a monotonically increasing integer or both the
          # Play Store and `adb install -r` will refuse the upgrade.
          # 1.2.3 -> 10203
          NUMERIC_VERSION=$(echo "$CLEAN_VERSION" | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')
          if grep -q '^android.numeric_version' buildozer.spec; then
            sed -i "s/^android.numeric_version = .*/android.numeric_version = ${NUMERIC_VERSION}/" buildozer.spec
          else
            sed -i "/^version = /a android.numeric_version = ${NUMERIC_VERSION}" buildozer.spec
          fi

      # Load-bearing. See README, "Why BuildKit is disabled".
      - name: Disable buildx alias
        run: docker buildx rm default 2>/dev/null || true

      - name: Build Android APK via Docker
        env:
          DOCKER_BUILDKIT: "0"
        run: |
          # `tr -d '\n'` is load-bearing: a trailing newline in the secret ends
          # up in the keystore password and jarsigner fails at the very end of
          # a ~40 minute build.
          KS_PASS=$(echo -n "${{ secrets.KEYSTORE_PASSWORD }}" | tr -d '\n')
          docker build --build-arg "KEYSTORE_PASSWORD=${KS_PASS}" -t apk-builder -f docker/dockerfile.android .
          docker create --name apk-build apk-builder
          mkdir -p dist/android
          docker cp apk-build:/dist/. ./dist/android/
          docker rm apk-build

      - name: Rename APK for release
        run: |
          APK=$(find dist/android -name '*.apk' | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" dist/app-release.apk
            echo "APK ready: dist/app-release.apk"
          else
            echo "No APK found in dist/android/"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/app-release.apk
          retention-days: 30
