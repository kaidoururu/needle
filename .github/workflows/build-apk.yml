name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git zlib1g-dev \
            python3-pip libncurses-dev zip unzip autoconf libtool pkg-config \
            ninja-build libffi-dev libssl-dev

      - name: Install buildozer and compatible toolchain
        run: |
          python -m pip install --upgrade pip
          pip install "cython<3.0" "setuptools<71.0.0" buildozer

      - name: Check buildozer.spec is the pinned one
        run: |
          REQ=$(grep '^requirements' buildozer.spec || echo 'requirements NOT FOUND')
          echo "spec requirements: $REQ"
          echo "$REQ" | grep -q 'python3==3.10.12' || {
            echo 'ERROR: buildozer.spec in repo is outdated (no pinned python3). Upload the updated spec.'; exit 1; }
          echo "$REQ" | grep -q 'pygame==2.6.1' || {
            echo 'ERROR: buildozer.spec in repo is outdated (no pinned pygame). Upload the updated spec.'; exit 1; }

      - name: Build APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build_log.txt

      - name: BUILD FAILED — error lines
        if: failure()
        run: |
          echo '==================== BUILD FAILED: ERROR LINES ===================='
          grep -n -i -E 'error|failed|traceback|exception|no such file|not found|cannot|could not' build_log.txt | tail -n 60 || true
          echo '==================================================================='

      - name: Upload build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt
          if-no-files-found: ignore

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: needle-apk
          path: bin/*.apk
