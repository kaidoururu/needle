name: Build and Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  APP_ANDROID_SDK_PATH: /usr/local/lib/android/sdk
  APP_ANDROID_NDK_PATH: /usr/local/lib/android/sdk/ndk/27.3.13750724
  ANDROID_PYJNUS_CYTHON_3: "1"
  JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev binutils
          pip install buildozer Cython==0.29.36 "setuptools<71.0.0"

      - name: Pre-install Apache Ant
        run: |
          set -e
          ANT_DIR="${HOME}/.buildozer/android/platform/apache-ant-1.9.4"
          if [ -f "$ANT_DIR/bin/ant" ]; then exit 0; fi
          mkdir -p "${HOME}/.buildozer/android/platform"
          curl -fsSL --retry 3 --retry-delay 5 \
            "https://archive.apache.org/dist/ant/binaries/apache-ant-1.9.4-bin.tar.gz" \
            -o /tmp/ant.tar.gz
          tar -xzf /tmp/ant.tar.gz -C "${HOME}/.buildozer/android/platform/"

      - name: Build APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build_log.txt

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt
          if-no-files-found: warn

      - name: Upload APK (artifact)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: needle-apk
          path: bin/*.apk

      # ---- Публикация в GitHub Releases ----
      - name: Create GitHub Release and upload APK
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
