name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # pyjnius 1.5.0 cythonizes its .pyx sources only when USE_CYTHON is set;
  # without it its setup.py fails with
  # "NameError: name 'PYX_FILES' is not defined" in the pip build backend.
  USE_CYTHON: "1"
  # let the pip build backend see the pinned Cython instead of an isolated env
  PIP_NO_BUILD_ISOLATION: "1"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev
          pip install buildozer Cython==0.29.36 "setuptools<71.0.0"

      - name: Check buildozer.spec is the pinned one
        run: |
          REQ=$(grep '^requirements' buildozer.spec || true)
          echo "requirements line: $REQ"
          echo "$REQ" | grep -q "python3==3.10.12" || { echo "::error::buildozer.spec in repo is outdated (no pinned python3)"; exit 1; }
          echo "$REQ" | grep -q "pyjnius==1.5.0" || { echo "::error::buildozer.spec in repo is outdated (pyjnius must be pinned to 1.5.0)"; exit 1; }
          echo "Spec OK: pinned requirements found."

      - name: Pre-download NDK with retries
        run: |
          set -e
          NDK_ZIP="${HOME}/.buildozer/android/platform/android-ndk-r28c-linux.zip"
          NDK_DIR="${HOME}/.buildozer/android/platform/android-ndk-r28c"
          if [ -d "$NDK_DIR" ] && [ -f "$NDK_DIR/ndk-build" ]; then
            echo "NDK r28c already present, skipping download."
            exit 0
          fi
          for ATTEMPT in 1 2 3; do
            echo "NDK download attempt $ATTEMPT of 3"
            rm -f "$NDK_ZIP"
            rm -rf "$NDK_DIR"
            if wget -q --tries=3 --timeout=60 \
                 "https://dl.google.com/android/repository/android-ndk-r28c-linux.zip" \
                 -O "$NDK_ZIP"; then
              if unzip -tq "$NDK_ZIP" > /dev/null 2>&1; then
                unzip -q "$NDK_ZIP" -d "${HOME}/.buildozer/android/platform/"
                echo "NDK downloaded and verified OK."
                exit 0
              fi
              echo "NDK archive is corrupted, retrying."
            else
              echo "NDK download failed, retrying."
            fi
          done
          echo "::error::NDK download failed after 3 attempts"
          exit 1

      - name: Build APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build_log.txt

      - name: Show error lines on failure
        if: failure()
        run: |
          echo "==================== BUILD FAILED: ERROR LINES ===================="
          grep -n -i -E "error|exception|failed" build_log.txt | tail -n 40 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: needle-apk
          path: bin/*.apk
