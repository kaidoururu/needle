name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install buildozer and cython
        run: |
          python -m pip install --upgrade pip wheel
          pip install buildozer cython

      - name: Cache buildozer platform (SDK, NDK, p4a)
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.cache/pip
          key: buildozer-ubuntu22-py310-v4-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-ubuntu22-py310-v4-

      - name: Install Android SDK with accepted licenses
        run: |
          set -euo pipefail
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Installing Android commandline-tools..."
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o /tmp/clt.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q /tmp/clt.zip -d /tmp/clt
            mv /tmp/clt/cmdline-tools "$SDK/cmdline-tools/latest"
            # buildozer ищет sdkmanager и в старом расположении tools/bin —
            # кладём его в оба, чтобы работал любой порядок проверки
            mkdir -p "$SDK/tools"
            cp -r "$SDK/cmdline-tools/latest/." "$SDK/tools/"
          fi
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          # yes завершается SIGPIPE, когда sdkmanager дочитал лицензии —
          # это норма, поэтому || true (иначе pipefail уронит шаг)
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "SDK ready, sdkmanager version:"
          sdkmanager --version

      - name: Build APK
        env:
          ANDROIDSDK: /home/runner/.buildozer/android/platform/android-sdk
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: needle-apk
          path: bin/*.apk
          if-no-files-found: error
